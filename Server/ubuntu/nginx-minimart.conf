# MiniMart Mayhem: web build + game WebSocket on one port (80).
# Web build:  /opt/minimart/web  (copy Unity's Builds/Web here)
# Game:       ws://<server-ip>/ws  -> Unity server build on 127.0.0.1:7777

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /opt/minimart/web;
    index index.html;

    # always fetch the latest page after a redeploy
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Unity web build, gzip with decompression fallback (*.unityweb). Sending Content-Encoding lets the
    # browser unzip natively, which is faster; Unity's loader also copes if it doesn't.
    location ~ \.wasm\.unityweb$ {
        add_header Content-Encoding gzip;
        default_type application/wasm;
    }
    location ~ \.js\.unityweb$ {
        add_header Content-Encoding gzip;
        default_type application/javascript;
    }
    location ~ \.unityweb$ {
        add_header Content-Encoding gzip;
        default_type application/octet-stream;
    }
    # uncompressed builds
    location ~ \.wasm$ { default_type application/wasm; }

    # game traffic: WebSocket to the Unity server build
    location /ws {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
